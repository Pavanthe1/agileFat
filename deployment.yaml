apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-waste-portal
  labels:
    app: e-waste-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: e-waste-portal
  template:
    metadata:
      labels:
      app: e-waste-portal
    spec:
      containers:
      - name: e-waste-portal-container
        image: pavansaladi/agilefat:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        # Health checks to ensure zero-downtime rollouts and detect errors
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: e-waste-portal-service
spec:
  type: NodePort
  selector:
    app: e-waste-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30015
